name: Build FS25 APK v1.2

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Creeaza aplicatia
        run: |
          mkdir -p app/src/main/java/com/fs25/companionro app/src/main/assets app/src/main/res/drawable
          cp FS25_Companion_Offline_v1_2.html app/src/main/assets/index.html

          cat > settings.gradle <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name='FS25CompanionRO'
          include ':app'
          EOF

          cat > build.gradle <<'EOF'
          plugins { id 'com.android.application' version '8.7.3' apply false }
          EOF

          cat > app/build.gradle <<'EOF'
          plugins { id 'com.android.application' }
          android {
            namespace 'com.fs25.companionro'
            compileSdk 35
            defaultConfig {
              applicationId 'com.fs25.companionro'
              minSdk 23
              targetSdk 35
              versionCode 3
              versionName '1.2'
            }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"><application android:theme="@android:style/Theme.Material.Light.NoActionBar" android:label="FS25 Companion RO" android:icon="@drawable/icon"><activity android:name=".MainActivity" android:screenOrientation="portrait" android:exported="true"><intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter></activity></application></manifest>
          EOF

          cat > app/src/main/res/drawable/icon.xml <<'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="108dp" android:height="108dp" android:viewportWidth="108" android:viewportHeight="108"><path android:fillColor="#173D22" android:pathData="M0,0h108v108h-108z"/><path android:fillColor="#79CF78" android:pathData="M18,58h72v24h-72z"/><path android:fillColor="#FFFFFF" android:pathData="M25,30h58v20h-58z"/></vector>
          EOF

          cat > app/src/main/java/com/fs25/companionro/MainActivity.java <<'EOF'
          package com.fs25.companionro;
          import android.app.Activity; import android.os.Bundle; import android.webkit.WebSettings; import android.webkit.WebView; import android.webkit.WebViewClient;
          public class MainActivity extends Activity {
            private WebView w;
            public void onCreate(Bundle b){super.onCreate(b);w=new WebView(this);setContentView(w);WebSettings s=w.getSettings();s.setJavaScriptEnabled(true);s.setDomStorageEnabled(true);s.setAllowFileAccess(true);w.setWebViewClient(new WebViewClient());w.loadUrl("file:///android_asset/index.html");}
            public void onBackPressed(){if(w.canGoBack())w.goBack();else super.onBackPressed();}
          }
          EOF

      - name: Compileaza APK
        run: gradle :app:assembleDebug

      - name: Pregateste APK
        run: cp app/build/outputs/apk/debug/app-debug.apk FS25-Companion-RO-v1.2.apk

      - uses: actions/upload-artifact@v4
        with:
          name: FS25-Companion-RO-v1.2
          path: FS25-Companion-RO-v1.2.apk
