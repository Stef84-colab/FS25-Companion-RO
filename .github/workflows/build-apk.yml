name: Build FS25 APK v1.1

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Ia fisierele
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Instaleaza Android 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Creeaza proiectul Android
        run: |
          mkdir -p app/src/main/java/com/fs25/companionro
          mkdir -p app/src/main/assets
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/drawable

          curl -L "https://raw.githubusercontent.com/Stef84-colab/FS25-Companion-RO/925929ff09baf1976009ca0cc5a2b85872ea998f/FS25_Companion_Offline_v1_1.html" -o app/src/main/assets/index.html

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "FS25CompanionRO"
          include(":app")
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.fs25.companionro'
              compileSdk 35

              defaultConfig {
                  applicationId "com.fs25.companionro"
                  minSdk 23
                  targetSdk 35
                  versionCode 2
                  versionName "1.1"
              }

              buildTypes {
                  release {
                      minifyEnabled false
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <application
                  android:theme="@style/AppTheme"
                  android:label="FS25 Companion RO"
                  android:icon="@drawable/icon"
                  android:roundIcon="@drawable/icon"
                  android:allowBackup="true">

                  <activity
                      android:name=".MainActivity"
                      android:screenOrientation="portrait"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>

                  </activity>

              </application>
          </manifest>
          EOF

          cat > app/src/main/res/values/styles.xml <<'EOF'
          <resources>
              <style name="AppTheme" parent="android:style/Theme.Material.Light.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:statusBarColor">#173D22</item>
                  <item name="android:navigationBarColor">#0C1710</item>
                  <item name="android:windowLightStatusBar">false</item>
              </style>
          </resources>
          EOF

          cat > app/src/main/res/drawable/icon.xml <<'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">

              <path
                  android:fillColor="#173D22"
                  android:pathData="M0,0h108v108h-108z"/>

              <path
                  android:fillColor="#79CF78"
                  android:pathData="M20,55h55v20h-55z"/>

              <path
                  android:fillColor="#79CF78"
                  android:pathData="M48,37h22v24h-22z"/>

              <path
                  android:fillColor="#FFFFFF"
                  android:pathData="M53,42h12v12h-12z"/>

              <path
                  android:fillColor="#111111"
                  android:pathData="M18,69a13,13 0,1 0,26 0a13,13 0,1 0,-26 0"/>

              <path
                  android:fillColor="#111111"
                  android:pathData="M64,70a11,11 0,1 0,22 0a11,11 0,1 0,-22 0"/>
          </vector>
          EOF

          cat > app/src/main/java/com/fs25/companionro/MainActivity.java <<'EOF'
          package com.fs25.companionro;

          import android.app.Activity;
          import android.os.Bundle;
          import android.graphics.Color;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          public class MainActivity extends Activity {

              private WebView webView;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  getWindow().setStatusBarColor(Color.rgb(23, 61, 34));
                  getWindow().setNavigationBarColor(Color.rgb(12, 23, 16));

                  webView = new WebView(this);
                  webView.setBackgroundColor(Color.rgb(12, 23, 16));
                  setContentView(webView);

                  WebSettings settings = webView.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setAllowFileAccess(true);
                  settings.setAllowContentAccess(true);

                  webView.setWebViewClient(new WebViewClient());
                  webView.loadUrl("file:///android_asset/index.html");
              }

              @Override
              public void onBackPressed() {
                  if (webView.canGoBack()) {
                      webView.goBack();
                  } else {
                      super.onBackPressed();
                  }
              }
          }
          EOF

      - name: Compileaza APK
        run: gradle :app:assembleDebug

      - name: Redenumeste APK
        run: cp app/build/outputs/apk/debug/app-debug.apk FS25-Companion-RO-v1.1.apk

      - name: Pune APK la descarcare
        uses: actions/upload-artifact@v4
        with:
          name: FS25-Companion-RO-v1.1
          path: FS25-Companion-RO-v1.1.apk
